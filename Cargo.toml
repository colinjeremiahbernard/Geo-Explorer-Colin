[package]
name = "geo-explorer"
version = "0.1.0"
edition = "2021"

[dependencies]
# Manipulação de linha de comando (CLI)
clap = { version = "4.4", features = ["derive"] }

# Leitura e parse do JSON de dados
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime (necessário para o MCP)
tokio = { version = "1.0", features = ["full"] }

# Cores no terminal (para dar um estilo legal ao certificado/trilhas)
colored = "2.0"
